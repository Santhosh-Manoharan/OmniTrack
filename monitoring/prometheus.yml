global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'omnitrack-containers'
    static_configs:
      - targets:
          - 'n8n:5678'
          - 'firefly:8080'
          - 'paperless:8000'
          - 'ollama:11434'
    metrics_path: /metrics

  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
