apiVersion: 1

datasources:
  - name: OmniTrack-PostgreSQL
    type: postgres
    url: postgres:5432
    database: omnitrack
    user: omnitrack
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 16000
      timescaledb: false
    isDefault: true
    editable: true
