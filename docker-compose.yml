services:
  postgres:
    image: postgres:16
    container_name: ot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnitrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: omnitrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnitrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ot-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:latest
    container_name: ot-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: omnitrack
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-omnitrack}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ot-paperless
    restart: unless-stopped
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: omnitrack
      PAPERLESS_DBUSER: ${POSTGRES_USER:-omnitrack}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-change-me}
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin}
      PAPERLESS_URL: http://localhost:8000
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ot-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  upload-helper:
    build:
      context: ./upload-helper
      dockerfile: Dockerfile
    container_name: ot-upload-helper
    restart: unless-stopped
    environment:
      PAPERLESS_URL: "http://paperless:8000"
      PAPERLESS_TOKEN: ${PAPERLESS_API_TOKEN}
      PORT: "8888"
    ports:
      - "8888:8888"
    depends_on:
      - paperless

  prometheus:
    image: prom/prometheus:latest
    container_name: ot-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/omnitrack.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/omnitrack.json:ro
    ports:
      - "3000:3000"

  transaction-api:
    build:
      context: ./transaction-api
      dockerfile: Dockerfile
    container_name: ot-transaction-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: omnitrack
      POSTGRES_USER: ${POSTGRES_USER:-omnitrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  receipt-upload:
    build:
      context: ./receipt-upload
      dockerfile: Dockerfile
    container_name: ot-receipt-upload
    restart: unless-stopped
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/upload-receipt
      PAPERLESS_URL: http://paperless:8000
    ports:
      - "8091:8091"
    depends_on:
      - n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  paperless_data:
  paperless_media:
  ollama_data:
  prometheus_data:
  grafana_data:
